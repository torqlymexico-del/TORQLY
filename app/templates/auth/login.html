<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | {{ settings.app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
    <style>
        .divider { display: flex; align-items: center; gap: .75rem; margin: 1.25rem 0; color: #aaa; font-size: .85rem; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e0e0e0; }
        .btn-google { display: flex; align-items: center; justify-content: center; gap: .65rem; width: 100%; padding: .7rem 1rem; border: 1.5px solid #dadce0; border-radius: 8px; background: #fff; color: #3c4043; font-size: .95rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: background .15s, box-shadow .15s; }
        .btn-google:hover { background: #f8f9fa; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
        .btn-google svg { flex-shrink: 0; }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <span class="brand-kicker">Torqly / El Garagillo</span>
        <h1>Control operativo del taller</h1>
        <p>Ingresa con tu teléfono y contraseña para abrir agenda, clientes, servicios y operación.</p>

        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        {% if message %}
        <div class="alert {{ level or 'info' }}">{{ message }}</div>
        {% endif %}

        <form method="post" action="/login" class="stack-form">
            <label>
                <span>Teléfono</span>
                <input type="text" name="phone" placeholder="6140000000" required>
            </label>
            <label>
                <span>Contraseña</span>
                <input type="password" name="password" placeholder="••••••••" required>
            </label>
            <button type="submit" class="btn btn-primary btn-block">Entrar al sistema</button>
        </form>

        {% if google_login %}
        <div class="divider">o</div>
        <a href="/auth/google" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            Continuar con Google
        </a>
        {% endif %}
    </div>
</body>
</html>
